name: Post-deployment order acceptance
# Run only after the compatible backend and storefront release is deployed.
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: post-deployment-order-acceptance
  cancel-in-progress: false
jobs:
  live-order:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cart: nonshipping
            requires-shipping: false
            mixed-cart: false
          - cart: physical
            requires-shipping: true
            mixed-cart: false
          - cart: mixed
            requires-shipping: true
            mixed-cart: true
          - cart: pickup-mixed
            requires-shipping: true
            mixed-cart: true
            pickup: true
    env:
      HEADLESS_PICKUP: ${{ matrix.pickup || false }}
      HEADLESS_REQUIRE_SHIPPING: ${{ matrix.requires-shipping }}
      HEADLESS_MIXED_CART: ${{ matrix.mixed-cart }}
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Install fixture tooling
        run: apt-get update && apt-get install --no-install-recommends -y jq
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Allocate isolated deployed fixture
        env:
          {
            HEADLESS_E2E_ALLOCATOR_TOKEN: "${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}",
          }
        run: bash .github/scripts/headless-fixture.sh allocate
      - name: Run deployed browser order journey
        run: npm run test:e2e:live
      - name: Release isolated deployed fixture
        if: always()
        env:
          {
            HEADLESS_E2E_ALLOCATOR_TOKEN: "${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}",
          }
        run: bash .github/scripts/headless-fixture.sh release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          {
            name: "playwright-report-${{ matrix.cart }}",
            path: "playwright-report/\nplaywright-live-report/",
            retention-days: 14,
          }
