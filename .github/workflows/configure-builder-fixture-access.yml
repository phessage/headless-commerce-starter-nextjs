name: Configure builder fixture access
# GitHub Free private repositories cannot consume organization Actions secrets.
# This copies the existing fixture token into a GitHub-only sealed envelope for
# ecommerce-builder. An operator applies the ciphertext via the Secrets API.
# No selectable destination/key/secret and no plaintext artifact or output.
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: configure-builder-fixture-access
  cancel-in-progress: false
jobs:
  seal:
    runs-on: [self-hosted, linux, x64, docker-services]
    container: python:3.12-slim
    timeout-minutes: 5
    steps:
      - run: python -m pip install PyNaCl==1.5.0
      - name: Seal existing allocator for ecommerce-builder
        env:
          ALLOCATOR_TOKEN: ${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          token = os.environ['ALLOCATOR_TOKEN']
          if not token:
              raise SystemExit('The source allocator secret is unavailable')
          public_key = PublicKey(base64.b64decode('lAgzEC5Sb7gh/kOpNfSt74Uz7EiZSZg/DeH9ED2p1V4='))
          payload = {
              'key_id': '3380204578043523366',
              'encrypted_value': base64.b64encode(SealedBox(public_key).encrypt(token.encode())).decode(),
          }
          with open('builder-allocator-sealed.json', 'w') as output:
              json.dump(payload, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: builder-allocator-sealed
          path: builder-allocator-sealed.json
          retention-days: 1
