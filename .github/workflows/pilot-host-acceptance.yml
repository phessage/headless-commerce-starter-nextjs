name: Owner pilot HTTPS acceptance
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: saas-pilot-https
  cancel-in-progress: false
jobs:
  accept:
    runs-on: [self-hosted, linux, x64, docker-services]
    timeout-minutes: 30
    env:
      HEADLESS_STOREFRONT_URL: https://saas-pilot.1ecomm.com
      HEADLESS_REQUIRE_SHIPPING: 'true'
      HEADLESS_MIXED_CART: 'true'
      HEADLESS_PICKUP: 'true'
      PILOT_IMAGE: registry.home.digitrend/saas-pilot-nextjs:${{ github.sha }}
      KUBECONFIG: ${{ github.workspace }}/.pilot-kubeconfig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the actual licensed customer archive
        run: |
          npm run pack:customer
          (cd release && sha256sum --check SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/pilot-customer"
          tar -xzf "release/$(node -p "require('./release/manifest.json').filename")" -C "$RUNNER_TEMP/pilot-customer"
          docker build -t "$PILOT_IMAGE" "$RUNNER_TEMP/pilot-customer"
          docker push "$PILOT_IMAGE"
      - name: Load namespace-scoped short-lived deployment access
        env:
          PILOT_KUBE_CONFIG: ${{ secrets.SAAS_PILOT_KUBE_CONFIG }}
        run: |
          test -n "$PILOT_KUBE_CONFIG"
          umask 077
          printf '%s' "$PILOT_KUBE_CONFIG" > "$KUBECONFIG"
      - name: Allocate real isolated pickup stock and catalog
        env:
          HEADLESS_E2E_ALLOCATOR_TOKEN: ${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}
        run: bash .github/scripts/headless-fixture.sh allocate
      - name: Deploy archive image independently of the commerce backend
        run: node .github/scripts/deploy-pilot.mjs
      - name: Verify HTTPS runtime and actual catalog
        run: npm run host:inspect -- "$HEADLESS_STOREFRONT_URL" "$HEADLESS_STORE_ID" "$HEADLESS_API_URL"
      - name: Run real hosted browser journey
        run: |
          docker run --rm --network=host -v "$PWD:/app" -w /app \
            -e HEADLESS_STOREFRONT_URL -e HEADLESS_STORE_ID -e HEADLESS_API_URL \
            -e HEADLESS_PUBLISHABLE_KEY -e HEADLESS_PRODUCT_ID -e HEADLESS_VARIANT_ID \
            -e HEADLESS_FIXTURE_ITEMS -e HEADLESS_PICKUP_LOCATION_ID -e HEADLESS_LEASE_ID \
            -e HEADLESS_REQUIRE_SHIPPING -e HEADLESS_MIXED_CART -e HEADLESS_PICKUP \
            mcr.microsoft.com/playwright:v1.62.1-noble npm run test:e2e:live
      - name: Release the fixture through the application
        if: always()
        env:
          HEADLESS_E2E_ALLOCATOR_TOKEN: ${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}
        run: bash .github/scripts/headless-fixture.sh release
      - name: Stop the acceptance host and discard its runtime credential
        if: always()
        run: |
          if [ -s "$KUBECONFIG" ]; then node .github/scripts/deploy-pilot.mjs stop; fi
          rm -f "$KUBECONFIG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-host-evidence
          path: |
            release/
            playwright-live-report/
          retention-days: 14
