name: CI
on:
  push:
    branches-ignore: ["integration/**", "wave/**"]
  pull_request:
    branches-ignore: ["integration/**"]
permissions: { contents: read }
jobs:
  browser:
    # Use the same maintained runner pool as deployed acceptance; hosted billing is unavailable.
    runs-on: [self-hosted, linux, x64, docker-services]
    # Match @playwright/test; browsers and OS libraries are supplied together.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Install fixture tooling
        run: apt-get update && apt-get install --no-install-recommends -y jq
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - uses: actions/upload-artifact@v4
        with: { name: licensed-customer-source, path: release/, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
