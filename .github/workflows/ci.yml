name: CI
on:
  push:
    branches-ignore: ["integration/**", "wave/**"]
  pull_request:
    branches-ignore: ["integration/**"]
permissions: { contents: read }
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Allocate isolated deployed fixture
        env: {HEADLESS_E2E_ALLOCATOR_TOKEN: '${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}'}
        run: bash .github/scripts/headless-fixture.sh allocate
      - name: Run deployed browser order journey
        run: npm run test:e2e:live
      - name: Release isolated deployed fixture
        if: always()
        env: {HEADLESS_E2E_ALLOCATOR_TOKEN: '${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}'}
        run: bash .github/scripts/headless-fixture.sh release
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
